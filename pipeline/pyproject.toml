[project]
name = "pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "boto3>=1.40,<2",
    "dagster==1.13.22",
    "polars>=1,<2",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "moto[s3]>=5,<6",
    "pytest>=8,<10",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.ruff]
src = ["src"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipeline"
registry_modules = [
    "pipeline.components.*",
]
