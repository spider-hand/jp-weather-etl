[project]
name = "jp_weather_etl"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3>=1.40,<2",
    "dagster==1.13.22",
    "duckdb>=1.5.5,<2",
    "polars>=1,<2",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "moto[s3]>=5,<6",
    "pytest>=8,<10",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storage", "queries", "pipeline"]
exclude = ["storage/tests", "queries/tests", "pipeline/tests"]

[tool.ruff]
src = ["."]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "queries", "storage"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipeline"
registry_modules = [
    "pipeline.components.*",
]
